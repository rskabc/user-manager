name: Validate application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check server.js
      - name: Validate browser JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('public/index.html','utf8');const m=h.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw Error('Inline application script not found');fs.writeFileSync('/tmp/user-manager-ui.js',m[1]);"
          node --check /tmp/user-manager-ui.js
      - name: Validate deployment script syntax
        run: bash -n deploy.sh
      - name: Prepare deployment environment
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config -q
      - name: Build Docker image
        run: docker build --tag user-manager-ci .
