services:
  user-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: user-manager
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /data
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8300}:3000"
    volumes:
      - user_manager_data:/data
    networks:
      - user-manager-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  user_manager_data:
    name: user_manager_data

networks:
  user-manager-internal:
    driver: bridge
